<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />

    <!-- PWA Meta -->
    <meta name="application-name" content="Rekha" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rekha" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0d9488" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#115e59" media="(prefers-color-scheme: dark)" />

    <!-- SEO & Open Graph -->
    <meta name="description" content="Rekha — A professional interactive educational whiteboard platform by AkashaVyom Labs. Teach better. Learn visually." />
    <meta name="keywords" content="whiteboard, education, teaching, classroom, interactive, Telugu, Devanagari, AkashaVyom" />
    <meta name="author" content="AkashaVyom Labs" />
    <meta property="og:title" content="Rekha — Teach Better. Learn Visually." />
    <meta property="og:description" content="Professional interactive educational whiteboard platform for teachers and students." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rekha — Teach Better. Learn Visually." />
    <meta name="twitter:description" content="Professional interactive educational whiteboard platform." />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Telugu:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap"
    />

    <!-- Load fonts (non-blocking) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Telugu:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Telugu:wght@300;400;500;600;700&family=Noto+Sans+Devanagari:wght@300;400;500;600;700&display=swap"
      />
    </noscript>

    <!-- KaTeX CSS is bundled locally via src/main.tsx -->

    <!-- Stylus / touch optimization -->
    <meta name="msapplication-tap-highlight" content="no" />

    <title>Rekha — Teach Better. Learn Visually.</title>

    <style>
      /* Critical CSS: prevent flash of unstyled content */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #202020;
        color: #f1f3f5;
        font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        /* Prevent overscroll bounce on iOS for canvas-heavy UI */
        overscroll-behavior: none;
      }

      /* Prevent text selection on canvas elements */
      canvas {
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }

      /* Loading spinner shown before React hydrates */
      #root-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #202020;
        z-index: 9999;
        transition: opacity 0.3s ease;
      }

      #root-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-ring {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(13, 148, 136, 0.2);
        border-top-color: #0d9488;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .loader-brand {
        margin-top: 16px;
        color: #0d9488;
        font-size: 1.125rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-align: center;
      }

      .loader-sub {
        color: #6c757d;
        font-size: 0.75rem;
        text-align: center;
        margin-top: 4px;
        letter-spacing: 0.08em;
      }

      .loader-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body>
    <!-- Initial loading state (removed by React once app mounts) -->
    <div id="root-loading" aria-hidden="true">
      <div class="loader-wrap">
        <div class="loader-ring"></div>
        <p class="loader-brand">Rekha</p>
        <p class="loader-sub">by AkashaVyom Labs</p>
      </div>
    </div>

    <!-- React app root -->
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
